<!DOCTYPE html>
<html>
<head>
    <title>CSS Styles Demonstration</title>

    <!-- Internal / Embedded CSS -->
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: darkblue;
            font-family: Georgia, serif;
        }

        p {
            color: green;
            font-size: 18px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Welcome to My Webpage!</h1>

    <p>This paragraph is styled using Internal CSS.</p>

    <!-- Inline CSS with different colour and font -->
    <h2 style="color: blue; font-family: 'Courier New'; font-size: 28px;">
        This is a very beautiful coding Language
    </h2>

    <p style="color: purple; font-family: Georgia; font-size: 22px; font-weight: bold;">
        This Programming language is easy to understand.
    </p>

    <div class="card">
        <h2>About HTML and CSS</h2>
        <p>HTML creates webpage structure.</p>
        <p>CSS makes webpages beautiful.</p>
    </div>

    <br>

    <button onclick="alert('Hello! You clicked the button!')">
        Click Me
    </button>

</body>
</html>
